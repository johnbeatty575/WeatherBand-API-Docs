openapi: 3.0.0
info:
  title: WeatherBand API
  description: "Houston's heat and Seattle's drizzle—now with client-side retro formatting."
  version: 1.0.0
  contact:
    name: Your Name
    url: https://github.com/yourusername
servers:
  - url: https://67ed51b04387d9117bbd31f6.mockapi.io/api/v1
paths:
  /forecast:
    get:
      summary: Get weather forecast
      parameters:
        - name: location
          in: query
          required: true
          schema: 
            type: string
            enum: [Houston, Seattle]
          example: "Houston"
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  location:
                    type: string
                  temp:
                    type: number
                  conditions:
                    type: string
                  poetic_summary:
                    type: string
              examples:
                Houston:
                  value:
                    id: "1"
                    location: "Houston"
                    temp: 28
                    conditions: "humid"
                    poetic_summary: "🌡️ Sweltering heat wraps around the Bayou City like a thick blanket."
                Seattle:
                  value:
                    id: "2"
                    location: "Seattle"
                    temp: 12
                    conditions: "drizzle"
                    poetic_summary: "🌧️ Misty rain whispers through the evergreens, a Seattle lullaby."